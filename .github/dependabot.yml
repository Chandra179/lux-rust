version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  # "docker" is Dependabot's fixed ecosystem name (there is no podman option).
  # Note: it does not yet detect files named "Containerfile"; only "Dockerfile".
  # https://github.com/dependabot/dependabot-core/issues/6067
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
