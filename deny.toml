# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with `cargo deny check` (also run in CI).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive licenses only. A dependency under any other license fails the
# check, which forces a deliberate decision.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# Not every allowed license is used by today's dependency tree.
unused-allowed-license = "allow"

# This workspace is `publish = false` and has no license yet; skip checking
# the workspace's own crates until you choose one.
[licenses.private]
ignore = true

[bans]
# Duplicate versions are common in a young dependency tree; surface them
# without failing the build.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
